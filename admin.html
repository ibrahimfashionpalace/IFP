<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFP - Owner Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #f8f9fa; color: #333; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); max-width: 500px; margin: 0 auto 20px; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { background: #111; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #333; }
    .order-box { border-left: 4px solid #111; padding: 10px; margin: 10px 0; background: #fafafa; }
  </style>
</head>
<body>

  <!-- Login Section -->
  <div id="login-card" class="card">
    <h2>Owner Login</h2>
    <input type="email" id="login-email" placeholder="Owner Email">
    <input type="password" id="login-pass" placeholder="Password">
    <button id="btn-login" type="button">Sign In</button>
    <p id="login-status" style="font-weight: 500;"></p>
  </div>

  <!-- Protected Admin Area -->
  <div id="admin-dashboard" style="display: none;">
    <div class="card">
      <h2>Add New Garment</h2>
      <input type="text" id="garment-name" placeholder="Garment Name">
      <input type="number" id="garment-price" placeholder="Price (₹)">
      <input type="text" id="garment-img" placeholder="Direct Image URL">
      <button id="btn-add-garment" type="button">Publish Garment Live</button>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Customer Deliveries</h2>
        <button id="btn-logout" type="button" style="width: auto; padding: 6px 14px;">Logout</button>
      </div>
      <div id="deliveries-container"></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // --- PASTE YOUR FIREBASE CONFIG KEYS HERE ---
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_ID",
      appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Elements
    const loginCard = document.getElementById('login-card');
    const adminDashboard = document.getElementById('admin-dashboard');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const btnAddGarment = document.getElementById('btn-add-garment');
    const loginStatus = document.getElementById('login-status');

    // Track Login State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginCard.style.display = 'none';
        adminDashboard.style.display = 'block';
        loadDeliveries();
      } else {
        loginCard.style.display = 'block';
        adminDashboard.style.display = 'none';
      }
    });

    // Sign In Action
    btnLogin.addEventListener('click', async () => {
      const email = document.getElementById('login-email').value.trim();
      const pass = document.getElementById('login-pass').value.trim();

      if (!email || !pass) {
        loginStatus.textContent = "Please enter both email and password.";
        loginStatus.style.color = "red";
        return;
      }

      loginStatus.textContent = "Checking credentials...";
      loginStatus.style.color = "blue";

      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        loginStatus.textContent = "Error: " + err.message;
        loginStatus.style.color = "red";
      }
    });

    // Logout Action
    btnLogout.addEventListener('click', async () => {
      await signOut(auth);
    });

    // Add Garment Action
    btnAddGarment.addEventListener('click', async () => {
      const title = document.getElementById('garment-name').value.trim();
      const price = document.getElementById('garment-price').value.trim();
      const image = document.getElementById('garment-img').value.trim();

      if (!title || !price) {
        alert("Please enter garment name and price.");
        return;
      }

      try {
        await addDoc(collection(db, "products"), {
          title: title,
          price: Number(price),
          image: image,
          createdAt: new Date()
        });
        alert("Garment published successfully!");
        document.getElementById('garment-name').value = '';
        document.getElementById('garment-price').value = '';
        document.getElementById('garment-img').value = '';
      } catch (err) {
        alert("Failed to save: " + err.message);
      }
    });

    // Load Deliveries
    async function loadDeliveries() {
      const container = document.getElementById('deliveries-container');
      container.innerHTML = "Loading customer orders...";
      try {
        const q = query(collection(db, "deliveries"), orderBy("createdAt", "desc"));
        const snapshot = await getDocs(q);
        if (snapshot.empty) {
          container.innerHTML = "<p>No orders yet.</p>";
          return;
        }
        container.innerHTML = "";
        snapshot.forEach((doc) => {
          const data = doc.data();
          container.innerHTML += `
            <div class="order-box">
              <p><b>Customer:</b> ${data.name || "N/A"}</p>
              <p><b>Phone:</b> ${data.phone || "N/A"}</p>
              <p><b>Address:</b> ${data.address || "N/A"}</p>
              <p><b>Item Ordered:</b> ${data.item || "N/A"}</p>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = "Unable to fetch orders: " + err.message;
      }
    }
  </script>
</body>
</html>
